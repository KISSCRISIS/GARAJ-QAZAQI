<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ALBASHIR Admin Roles</title>

<link rel="stylesheet" href="./style.css">

<style>

body{
display:block;
overflow:auto;
}


.admin-shell{
width:min(1100px,95%);
margin:auto;
padding:40px;
}


.admin-card{

background:var(--panel,#151515);

border:1px solid var(--line,#333);

border-radius:25px;

padding:30px;

box-shadow:0 0 30px #000;

}



h1{
color:#ff5555;
font-size:55px;
}



label{

display:block;

margin:15px 0 8px;

color:#ffd0d0;

font-weight:bold;

}


input,select,button{

width:100%;

padding:14px;

border-radius:14px;

border:1px solid #333;

background:#090909;

color:white;

font-size:18px;

}



button{

background:#b00000;

cursor:pointer;

font-weight:bold;

margin-top:20px;

}


.role-item{

background:#111;

border:1px solid #333;

border-radius:15px;

padding:15px;

margin:10px 0;

color:white;

}


#result{

margin-top:20px;

font-weight:bold;

}


.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:25px;

}


@media(max-width:800px){

.grid{

grid-template-columns:1fr;

}

}

</style>

</head>


<body>


<main class="admin-shell">


<section class="admin-card">


<h1>
إدارة الأدمنز والصلاحيات
</h1>


<p>
هذه الصفحة مخصصة لـ SUPER_ADMIN فقط.
</p>



<h2>
تسجيل الدخول
</h2>


<form id="loginForm">


<label>
البريد الإلكتروني
</label>


<input 
id="email"
type="email"
required>



<label>
كلمة المرور
</label>


<input 
id="password"
type="password"
required>



<button type="submit">
دخول
</button>


</form>




<hr style="margin:35px 0;border-color:#333">





<h2>
إضافة / تعديل صلاحية
</h2>



<form id="roleForm">


<label>
Supabase User ID
</label>


<input
id="userId"
placeholder="ضع UUID المستخدم">


<label>
الدور
</label>


<select id="role">


<option value="SUPER_ADMIN">
SUPER_ADMIN
</option>


<option value="GUARD">
GUARD
</option>


<option value="EMPLOYEE">
EMPLOYEE
</option>


</select>



<button type="submit">
حفظ الصلاحية
</button>


</form>





<div id="result"></div>





<hr style="margin:35px 0;border-color:#333">





<h2>
قائمة الصلاحيات الحالية
</h2>



<div id="rolesList">

</div>




</section>


</main>





<script src="./config.js"></script>

<script src="./admins.js"></script>


</body>

</html>
