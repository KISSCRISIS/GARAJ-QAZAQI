<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Employee Management | ALBASHIR Gate</title>

<link rel="stylesheet" href="./style.css">

<style>

body {
    display:block;
    overflow:auto;
}


.admin-shell {

    width:min(1200px,100%);
    margin:auto;
    padding:32px;

}


.admin-card {

    background:var(--panel);

    border:1px solid var(--line);

    border-radius:28px;

    padding:30px;

    box-shadow:var(--shadow);

}


.form-grid {

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:18px;

}


label {

    display:block;

    color:#ffccd2;

    font-weight:900;

    margin:14px 0 8px;

}


input,
button {

    width:100%;

    border:1px solid var(--line);

    border-radius:14px;

    padding:14px;

    font:inherit;

}


input {

    background:#0f0f12;

    color:white;

}


button {

    cursor:pointer;

    background:linear-gradient(
        135deg,
        var(--red-dark),
        var(--red)
    );

    color:white;

    font-weight:950;

    margin-top:18px;

}


.preview {

    width:220px;

    height:220px;

    border-radius:24px;

    object-fit:cover;

    background:#09090b;

    border:1px solid var(--line);

}


.admin-note {

    color:var(--muted);

    line-height:1.8;

}


.result {

    margin-top:18px;

    color:var(--green);

    font-weight:900;

}


.employee-list {

    margin-top:25px;

    display:grid;

    gap:15px;

}


.employee-card {

    background:#111;

    border:1px solid var(--line);

    border-radius:18px;

    padding:18px;

    display:flex;

    align-items:center;

    gap:20px;

}


.employee-photo {

    width:90px;

    height:90px;

    border-radius:50%;

    object-fit:cover;

}


.employee-info {

    text-align:right;

}


@media(max-width:800px){

    .form-grid {

        grid-template-columns:1fr;

    }


    .employee-card {

        flex-direction:column;

    }


    .preview {

        width:100%;

        height:auto;

        aspect-ratio:1;

    }

}

</style>

</head>


<body>


<main class="admin-shell">


<section class="admin-card">


<p class="eyebrow">
Employee Management
</p>


<h1 style="font-size:clamp(34px,4vw,62px)">
إدارة الموظفين
</h1>


<p class="admin-note">

هذه الصفحة لإدارة بيانات وصور الموظفين.
تستخدم قاعدة البيانات الحالية و Bucket الصور الخاص بالموظفين.
يتم عرض الصور باستخدام Signed URLs بشكل آمن.

</p>



<!-- LOGIN -->

<form id="loginForm" class="form-grid">


<div>

<label for="email">
إيميل الإدارة
</label>

<input 
id="email"
type="email"
autocomplete="email"
required>

</div>



<div>

<label for="password">
كلمة المرور
</label>

<input 
id="password"
type="password"
autocomplete="current-password"
required>

</div>



<button type="submit">
تسجيل دخول
</button>


</form>



<hr style="
border:0;
border-top:1px solid var(--line);
margin:30px 0;
">





<!-- EMPLOYEE FORM -->

<div class="form-grid">


<form id="employeeForm">


<label for="employeeId">
رقم الموظف
</label>

<input 
id="employeeId"
required
autocomplete="off">



<label for="fullName">
اسم الموظف
</label>

<input 
id="fullName">



<label for="phoneNumber">
رقم الهاتف
</label>

<input 
id="phoneNumber">



<label for="department">
القسم
</label>

<input 
id="department">



<label for="specialty">
الاختصاص
</label>

<input 
id="specialty">



<label for="employeeStatus">
الحالة
</label>

<input 
id="employeeStatus">



<label for="photoFile">
صورة الموظف
</label>

<input 
id="photoFile"
type="file"
accept="image/*">



<button type="submit">
حفظ بيانات ورفع الصورة
</button>


</form>





<div>


<label>
معاينة الصورة
</label>


<img 
id="preview"
class="preview"
alt="معاينة صورة الموظف">


<div 
id="result"
class="result">
</div>


</div>


</div>





<hr style="
border:0;
border-top:1px solid var(--line);
margin:35px 0;
">



<h2>
قائمة الموظفين
</h2>



<div 
id="employeesList"
class="employee-list">

</div>



</section>


</main>




<script src="./config.js"></script>

<script src="./admin.js"></script>


</body>

</html>
